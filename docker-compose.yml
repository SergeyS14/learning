services:
  nuxt:
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - '5000:5000'
    restart: always
    environment:
      - PORT=5000
    command: npm run start
  nuxt_dev:
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - '3000:3000'
    restart: always
    environment:
      - PORT=3000
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - "//c/learning/frontend:/web:rw"
    command: npm run dev
